<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="output.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier — Hollow-Block System</title>
</head>
<body data-role="cashier">
    <script src="role-routes.js"></script>
    <script src="authguard.js"></script>
    <div class="app-header flex items-center justify-between p-4">
        <div>
            <h1 class="app-title">Hollow-Block System</h1>
            <p class="text-sm text-slate-300">Cashier dashboard</p>
        </div>
        <button id="logout-btn" class="btn btn-sm btn-neutral">Logout</button>
    </div>

    <div class="flex flex-col sm:flex-row w-full gap-6 p-4">

        <div class="sm:w-2/3 w-full panel">
            <div class="panel-header">
                <span>Products Catalog</span>
            </div>
            <div id="products-list" class="list-container"></div>
        </div>

        <div class="sm:w-1/3 w-full panel">
            <div class="panel-header">
                <span>Order</span>
            </div>
            <div id="cart-list" class="list-container"></div>
            <div id="cart-total" class="total-bar">Total: ₱0</div>
            <div class="mt-3 flex justify-end">
                <button id="checkout-btn" class="btn btn-primary text-xl">Proceed</button>
            </div>
        </div>

        <div id="receipt-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">
            <div class="panel w-full max-w-sm space-y-3">
                <div class="panel-header">
                    <span>Order summary</span>
                </div>
                <p id="processed-by-display" class="text-sm text-slate-500"></p>
                <input type="text" id="order-name" placeholder="Order name" class="form-input"/>
                <div>
                    <label for="payment-method" class="form-label">Payment Method</label>
                    <select id="payment-method" name="payment-method" class="form-input">
                        <option value="Gcash">Gcash</option>
                        <option value="Cash">Cash</option>
                        <option value="Bank">Bank</option>
                        <option value="Installment">Installment</option>
                    </select>
                </div>
                <input type="text" id="order-notes" placeholder="Remark" class="form-input"/>
                <div id="receipt-list" class="divide-y divide-slate-200"></div>
                <div id="receipt-total" class="text-xl font-bold text-right mt-4 border-t-2 border-slate-200 pt-2">Total: ₱0</div>
                <button id="summarize-order" class="btn btn-primary w-full mt-2">Confirm</button>
            </div>
        </div>

        <div class="w-full panel m-2">
            <div class="panel-header-compact">
                <span>My Order History</span>
                <button id="summary-toggle-btn" class="btn btn-sm btn-neutral">View Summary</button>
            </div>
            <div id="summary-panel" class="hidden bg-slate-50 rounded-2xl border border-slate-200 p-4 space-y-4"></div>
            <div id="order-history-list" class="list-container mt-2"></div>
        </div>

    </div>

    <script src="storage.js"></script>
    <script src="dashboard-common.js"></script>
    <script src="cashier.js"></script>
</body>
</html>
