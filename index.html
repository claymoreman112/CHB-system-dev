<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="output.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Demo</title>
</head>
<body>
    <div class="bg-gray-600 p-4 w-full h-auto">
        <h1 class="text-white text-3xl font-serif font-bold">Hollow-Block POS Demo</h1>
    </div>

   <div class="flex flex-col sm:flex-row w-full gap-6 p-4">

   
    <div class="sm:w-2/3 w-full bg-white rounded-xl shadow-md">
        <h2 class="text-black text-2xl font-serif font-bold border-b-2 border-gray-200 pb-2 bg-gray-400 rounded-xl p-2 shadow-lg">Products Catalog</h2>
        <div id="products-list" class="p-2 bg-gray-300 rounded-xl">
        </div>
    </div>

    <div class="sm:w-1/3 w-full bg-gray-50 rounded-xl shadow-md p-4">
        <h2 class="text-black text-2xl font-serif font-bold border-b-2 border-gray-200 pb-2 bg-gray-400 rounded-xl p-2">Order</h2>
        <div id="cart-list" class="divide-y divide-gray-200 bg-gray-300 rounded-xl p-2">
        </div>
        <div id="cart-total" class="p-4 text-xl font-bold text-right border-t-2 border-gray-200 mt-2 bg-gray-300 shadow-lg rounded-2xl">
            Total: ₱0
            
        </div>
        <div class="p-2 m-2 flex justify-end">
            <button id="checkout-btn" class="p-2 bg-gray-400 rounded-lg shadow-lg hover:bg-gray-200 text-2  xl border-2 border-black">Confirm</button></div>
        
    </div>

</div>

<div id="receipt-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-sm">
        <h2 class="text-2xl font-serif font-bold border-b-2 border-gray-200 pb-2 mb-2">Order summary</h2>
        <div id="receipt-list" class="divide-y divide-gray-200">

        </div>
        <div id="receipt-total" class="text-xl font-bold text-right mt-4 border-t-2 border-gray-200 pt-2">Total: ₱0</div>
        <button id="new-order-btn" class="w-full mt-6 bg-gray-500 text-white font-bold py-3 rounded-xl hover:bg-gray-200">New Order</button>

    </div>

</div>

    <script src="script.js"></script>
</body>
</html>
