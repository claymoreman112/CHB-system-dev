<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="output.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Demo</title>
</head>
<body>
    <div class="bg-gray-600 p-4 w-full h-auto">
        <h1 class="text-white text-3xl font-serif font-bold">Hollow-Block POS Demo</h1>
    </div>

    <div class="flex flex-col sm:flex-row w-full gap-4">

        <div class="sm:w-2/3 w-full">
            <div class="p-2 w-full h-auto">
                <h2 class="text-black text-2xl font-serif font-bold">Products Catalog</h2>
            </div>
            <div id="products-list" class="bg-gray-100 w-full h-auto divide-y divide-gray-300 p-8">

            </div>
        </div>

        <div class="sm:w-1/3 w-full">
            <div class="p-2 w-full h-auto">
                <h2 class="text-black text-2xl font-serif font-bold">Cart</h2>
            </div>
            <div id="cart-list" class="bg-gray-100 w-full h-auto divide-y divide-gray-300 p-8">

            </div>
            <div id="cart-total" class="p-4 text-xl font-bold text-right">
                Total: php0
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
