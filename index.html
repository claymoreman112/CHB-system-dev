<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="output.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Demo</title>
</head>
<body>
   <div class="app-header">
    <h1 class="app-title">Hollow-Block POS Demo</h1>
</div>

   <div class="flex flex-col sm:flex-row w-full gap-6 p-4">

   
<div class="sm:w-2/3 w-full panel">
    <div class="panel-header">
        <span>Products Catalog</span>
        <div class="panel-header-actions">
            <button id="admin-toggle-btn" class="btn btn-sm btn-neutral">Admin Mode</button>
            <button id="add-product-btn" class="hidden btn btn-sm btn-neutral">+ Add Product</button>
        </div>
    </div>
    <div id="products-list" class="list-container">
    </div>
    <div id="add-product-form" class="hidden form-panel mt-3">
        <input type="text" id="new-product-name" placeholder="Product name" class="form-input"/>
        <input type="number" id="new-product-price" placeholder="Price" class="form-input"/>
        <input type="text" id="new-product-unit" placeholder="Unit (e.g. piece)" class="form-input"/>
        <input type="number" id="new-product-stock" placeholder="Starting stock" class="form-input"/>
        <button id="create-product-btn" class="btn btn-primary w-full">Create Product</button>
    </div>
</div>

  <div class="sm:w-1/3 w-full panel">
    <div class="panel-header">
        <span>Order</span>
    </div>
    <div id="cart-list" class="list-container">
    </div>
    <div id="cart-total" class="total-bar">
        Total: ₱0
    </div>
    <div class="mt-3 flex justify-end">
        <button id="checkout-btn" class="btn btn-primary text-xl">Proceed</button>
    </div>
</div>

<div id="receipt-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">
    <div class="panel w-full max-w-sm space-y-3">
        <div class="panel-header">
            <span>Order summary</span>
        </div>
        <input type="text" id="order-name" placeholder="Order name" class="form-input"/>
        <input type="text" id="worker-name" placeholder="Worker name" class="form-input"/>
        <div>
            <label for="payment-method" class="form-label">Payment Method</label>
            <select id="payment-method" name="payment-method" class="form-input">
                <option value="Gcash">Gcash</option>
                <option value="Cash">Cash</option>
                <option value="Bank">Bank</option>
                <option value="Installment">Installment</option>
            </select>
        </div>
        <input type="text" id="order-notes" placeholder="Remark" class="form-input"/>
        <div id="receipt-list" class="divide-y divide-slate-200">
        </div>
        <div id="receipt-total" class="text-xl font-bold text-right mt-4 border-t-2 border-slate-200 pt-2">Total: ₱0</div>
        <button id="summarize-order" class="btn btn-primary w-full mt-2">Confirm</button>
    </div>
</div>

<div class="w-full panel m-2">
    <div class="panel-header-compact">
        <span>Order History</span>
        <button id="summary-toggle-btn" class="btn btn-sm btn-neutral">View Summary</button>
    </div>
    <div id="summary-panel" class="hidden bg-slate-50 rounded-2xl border border-slate-200 p-4 space-y-4"></div>
    <div id="order-history-list" class="list-container mt-2">
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
